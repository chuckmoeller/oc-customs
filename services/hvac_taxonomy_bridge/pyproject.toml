[project]
name = "hvac-taxonomy-bridge"
version = "0.1.0"
description = "Standardized ASHRAE 205-aligned translation layer for HVAC equipment and coating data"
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.11"
authors = [
    { name = "Chuck Moeller" }
]
dependencies = [
    "pydantic>=2.0",
    "schema205 @ git+https://github.com/open205/schema-205.git@v3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hvac_taxonomy_bridge"]

[tool.hatch.metadata]
# schema205 isn't published to PyPI (see PROJECT.md / schema/ashrae_205.py) —
# it's only installable as a direct git reference.
allow-direct-references = true
