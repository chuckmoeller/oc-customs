services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: madison_user
      POSTGRES_PASSWORD: secure_db_password
      POSTGRES_DB: madison_stack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stack-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U madison_user"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:alpine
    container_name: redis_broker
    restart: always
    command: redis-server --save 60 1 --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - stack-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  madison-crm:
    build:
      context: ./services/madison-crm
      dockerfile: Dockerfile
    container_name: madison-crm
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://madison_user:secure_db_password@postgres:5432/madison_stack
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stack-net

  site-hunter:
    build:
      context: ./services/site-hunter
      dockerfile: Dockerfile
    container_name: site-hunter
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://madison_user:secure_db_password@postgres:5432/site_hunter
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stack-net

  spec-hunter:
    build:
      context: ./services/spec-hunter
      dockerfile: Dockerfile
    container_name: spec-hunter
    restart: always
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://madison_user:secure_db_password@postgres:5432/madison_stack
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stack-net

  giveback-gardening:
    build:
      context: ./services/giveback-gardening
      dockerfile: Dockerfile
    container_name: giveback-gardening
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://madison_user:secure_db_password@postgres:5432/madison_stack
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stack-net

  fieldy-execution-agent:
    build:
      context: ./services/fieldy-orchestrator/fieldy-execution-agent
      dockerfile: Dockerfile
    container_name: fieldy-execution-agent
    restart: always
    environment:
      - REDIS_URL=redis://redis:6379/0
      - GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/adc.json
      - GCP_PROJECT_ID=first-project-db-81b5e
    volumes:
      - ./secrets/adc.json:/app/secrets/adc.json:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - stack-net

  fieldy-worker:
    build:
      context: ./services/fieldy-orchestrator/fieldy-worker
      dockerfile: Dockerfile
    container_name: fieldy-worker
    restart: always
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - stack-net

    automation-hub:
      build:
        context: ./services/automation-hub
        dockerfile: Dockerfile
      container_name: automation-hub
      restart: always
      ports:
        - "8090:8090"
      environment:
        - REDIS_URL=redis://redis:6379/0
        - DATABASE_URL=postgresql+asyncpg://madison_user:secure_db_password@postgres:5432/automation_hub
        - SMTP_USER=${SMTP_USER}
        - SMTP_PASSWORD=${SMTP_PASSWORD}
        - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
        - ASANA_PAT=${ASANA_PAT}
        - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
        - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_healthy
      networks:
        - stack-net
  
volumes:
  redis_data:
  postgres_data:

networks:
  stack-net:
    driver: bridge
