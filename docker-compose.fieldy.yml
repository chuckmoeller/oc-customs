version: "3.9"

services:
  fieldy-webhook:
    build:
      context: .
      dockerfile: Dockerfile.fieldy-webhook
    container_name: fieldy-webhook
    restart: always
    ports:
      - "8003:8003"
    env_file:
      - .env
    environment:
      - FIELDY_API_KEY=${FIELDY_API_KEY}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - LOG_LEVEL=INFO
    networks:
      - stack-net

  outlook-tasks-worker:
    build:
      context: .
      dockerfile: Dockerfile.outlook-worker
    container_name: outlook-tasks-worker
    restart: always
    env_file:
      - .env
    environment:
      - MICROSOFT_GRAPH_TOKEN=${MICROSOFT_GRAPH_TOKEN}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - LOG_LEVEL=INFO
    networks:
      - stack-net

networks:
  stack-net:
    external: true
